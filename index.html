<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UPRISING</title>
<!-- inline favicon: avoids a 404 for /favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1f22'/%3E%3Crect x='3' y='5' width='10' height='6' fill='none' stroke='%23d9a441' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=32">
</head><body>
<div id="grain"></div>

<!-- Title screen -->
<section id="scrTitle" class="screen on">
  <h1 class="gtitle">UPRISING</h1>
  <p class="sub">A revolt simulator · real maps · invented people</p>
  <button id="bNew" class="big">New revolt</button>
  <button id="bCont" class="big ghost" hidden>Continue</button>
  <button id="bLegend" class="big ghost">Icon legend</button>
  <p class="fine">Map data: Natural Earth (public domain). All factions, regimes and leaders are invented.</p>
</section>

<!-- Main app: same canvas for world screen and country screen -->
<div id="app">
  <header id="top">
    <b class="gtitle sm">UPRISING</b>
    <span id="res"></span>
  </header>
  <aside id="left"></aside>
  <main id="mapWrap"><canvas id="map" aria-label="map"></canvas><canvas id="tok" class="layer"></canvas><div id="tip" hidden></div>
    <div id="zoomBtns"><button data-z="1.4" aria-label="zoom in">+</button><button data-z="0.7" aria-label="zoom out">−</button></div></main>
  <aside id="right"></aside>
  <nav id="bottom"></nav>
</div>

<div id="modal" hidden><div id="mbox"></div></div>
<div id="paused">Paused</div>

<!-- load order: audio (AUDIO-HOOKUP.md), art, then game -->
<script src="assets/sfx.js?v=32"></script>
<script src="assets/music.js?v=32"></script>
<script src="assets/emberline-art.js?v=32"></script>
<script src="assets/tokens.js?v=32"></script>
<script src="assets/season.js?v=32"></script>
<script src="assets/warn.js?v=32"></script>
